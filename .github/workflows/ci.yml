name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Section 6, gates 1-4, 6 and 8, in the order the brief specifies. Any failure
  # blocks the merge.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # --frozen-lockfile: CI never resolves dependencies on its own. Combined
      # with minimumReleaseAge in pnpm-workspace.yaml, the set of code that runs
      # here is exactly the set a human reviewed in the lockfile diff.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 1. typecheck
        run: pnpm typecheck

      - name: 2. lint
        run: pnpm lint

      - name: 3. dep-cruise
        run: pnpm dep-cruise

      - name: Dependency graph
        if: always()
        run: mkdir -p reports && pnpm dep-cruise:graph

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-graph
          path: reports/dependency-graph.svg
          if-no-files-found: warn

      # Gate 3b. A schema change that arrives without a migration is caught here
      # rather than at deploy time, when the only options left are bad ones.
      - name: 3b. migrations match the schema
        run: pnpm db:drift

      - name: 3c. migration journal is consistent
        run: pnpm db:check

      - name: 4. test:unit
        run: pnpm test:unit

      - name: 6. build
        run: pnpm build

      - name: 8. jscpd
        run: pnpm jscpd

  # Section 6, gate 4b. Split out because it is the only gate that needs Docker:
  # the suite starts a throwaway Postgres with testcontainers rather than
  # reusing a shared database, so it either gets a real server or fails.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 4b. test:integration
        run: pnpm test:integration

  # Section 6, gate 5. Split out because it is slow and independent of the rest.
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 5. test:mutation
        run: pnpm test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: warn

  # Section 9. Kept in CI permanently: a rule that dies later must surface here,
  # not months afterwards when someone notices the gate never fired.
  gate-liveness:
    name: Gate liveness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every gate that runs under vitest: the lint, typecheck and dep-cruise
      # fixtures, and the gates that are functions over values -- supply chain,
      # ADR shape, review surface, spec isolation, E2E liveness, and the test
      # surface itself.
      - name: Fixture and shape gates
        run: pnpm verify:gates

      - name: server-only build fixture
        run: pnpm verify:gates:build

      - name: Mutation threshold fixture
        run: pnpm verify:gates:mutation

      - name: Migration drift fixture
        run: pnpm verify:gates:migration

      # ADR-0006. The specs against an empty page, where every one of them must
      # fail on a line of its own. Here rather than in `E2E build` so it runs on
      # every pull request, including the one that lands a spec on a milestone:
      # a spec that asserts nothing is caught while it is being reviewed, not
      # after a milestone has been built on it. It needs no build and no server
      # beyond the one the script starts.
      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E specs fail against an empty page
        run: pnpm verify:gates:e2e

  # ADR-0002. The specs are the requirements and they land first, so a change
  # that edits a spec and the code the spec judges, in one pull request, can make
  # a failing requirement pass by rewriting it. The branch names decide the one
  # exemption: a milestone meeting the trunk carries both halves, because both
  # were reviewed on the way in. Nothing here limits how much else a pull request
  # does. It needs a pull request to read, so it is the one gate `pnpm gates`
  # cannot run.
  isolation:
    name: Spec isolation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # package-manager-cache defaults to true, and setup-node then reads
      # `packageManager` out of package.json and shells out to pnpm to find its
      # store. This job installs nothing, so pnpm is not on PATH and the step
      # fails before the check runs. Turning the cache off is the whole fix:
      # there is nothing to cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # The file list comes from the pull request itself rather than from a git
      # diff: a diff needs the merge base, so it needs the right base ref and a
      # full-depth checkout, and getting either wrong makes the check pass
      # quietly. A rename arrives as previous_filename too, so moving a spec out
      # of e2e/ counts as touching both sides.
      #
      # No install step: the check has no dependencies, and Node 24 runs the
      # TypeScript file directly.
      - name: e2e/ changes alone
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not interpolated into the script: a branch
          # name is chosen by whoever opens the pull request, and a template
          # expression is substituted into the script text before bash parses
          # it. Read-only permissions bound what that could do here; this costs
          # two lines and removes the question.
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | node tools/check-pr-isolation.ts "$HEAD_REF" "$BASE_REF"

  # ADR-0013. Nothing migrated the preview database, which cost nothing while the
  # schema was empty. The first table makes every preview of a pull request whose
  # code reads it a broken deployment until someone remembers.
  #
  # Push to `main` only, so the preview database carries what `main` carries and
  # nothing else. A pull request whose own migration has not merged still has a
  # broken preview: that is the migration-first rule in docs/DEPLOYMENT.md, not a
  # gap here.
  #
  # No approval on this environment, unlike `production-database`, so preview is
  # migrated ahead of Production and a migration that is going to fail has
  # usually failed before the owner is asked to apply it. The two databases are
  # one migration apart by design.
  #
  # `preview-database` accepts only `main`, so no pull request job can read
  # PREVIEW_DATABASE_URL. What could still reach it is a change to this file or
  # to a package script this job runs; what it would leak is a disposable
  # database.
  migrate-preview:
    name: Migrate preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gates, integration]
    environment: preview-database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'PREVIEW_DATABASE_URL is not set. Skipping; see docs/DEPLOYMENT.md.'
            exit 0
          fi
          pnpm --filter @repo/db db:migrate

  # ADR-0019. Whether `Apply migrations` has anything to apply: a file under
  # packages/db/drizzle/ changed since the last commit Production was migrated
  # at, read from the `production-database` deployments. No secret and no
  # environment, so it never waits and cannot read the database URL. Every doubt
  # it meets resolves to "pending", which asks the owner, as every push did
  # before.
  #
  # Full history, because the last migrated commit can be any number of pushes
  # back: a run waiting for approval is cancelled by the next push, and the
  # migration it carried is still pending. No install step: the script has no
  # dependencies, and Node 24 runs the TypeScript file directly.
  pending-migrations:
    name: Pending migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      pending: ${{ steps.find.outputs.pending }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # package-manager-cache off for the reason the isolation job gives: pnpm
      # is not installed here.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Find pending migrations
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/find-pending-migrations.ts

  # Migrations are applied from CI, not from the Vercel build: a build runs for
  # every preview and must never touch the production database, and Vercel gives
  # no hook that runs once per production deploy.
  #
  # The environment holds PRODUCTION_DATABASE_URL as an environment secret and
  # requires the owner's approval, so the job waits before it can read the URL,
  # and no other job can read it at all. Without the secret the step reports
  # that it is unset and succeeds. See docs/DEPLOYMENT.md.
  #
  # Skipped when `Pending migrations` finds nothing to apply, so a push with no
  # migration asks nobody for anything (ADR-0019). The condition names every
  # result rather than relying on the implicit success(): if that job fails or
  # is skipped its output is empty, which is not 'false', so this still runs and
  # asks. A broken check fails towards the approval, never past it.
  migrate:
    name: Apply migrations
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.gates.result == 'success' && needs.integration.result == 'success' &&
      needs.pending-migrations.outputs.pending != 'false'
    needs: [gates, integration, pending-migrations]
    environment: production-database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'PRODUCTION_DATABASE_URL is not set. Skipping; see docs/DEPLOYMENT.md.'
            exit 0
          fi
          pnpm --filter @repo/db db:migrate
