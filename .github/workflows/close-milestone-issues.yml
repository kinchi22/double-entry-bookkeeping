name: Close milestone issues

# GitHub closes the issues a pull request names with `Closes #<n>` when it
# merges into the default branch, and never for any other base. A Task's pull
# request merges into milestone/<name> (docs/agents/issue-tracker.md), so this
# closes what it names instead, and the project moves the Task to Done on the
# close. The Feature itself closes the ordinary way, with the milestone's pull
# request into main.
#
# It is not a check on any branch: it runs after a merge, and its only effect is
# closing issues.

on:
  pull_request:
    types: [closed]
    branches: ['milestone/**']

permissions:
  issues: write

jobs:
  close:
    name: Close milestone issues
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close the issues the pull request names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # GitHub's closing keywords, then the number alone.
          numbers=$(printf '%s\n' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+\b' \
            | grep -oE '[0-9]+$' | sort -un || true)
          for n in $numbers; do
            # The issues endpoint also answers for a pull request's number.
            state=$(gh api "repos/$GH_REPO/issues/$n" --jq 'select(.pull_request == null) | .state')
            if [ "$state" = open ]; then
              gh issue close "$n" --comment "Closed by #$PR, merged into \`$BASE\`."
            fi
          done
