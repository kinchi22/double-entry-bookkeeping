name: E2E build

# Section 6, gate 7, as a merge gate. ADR-0006. The suite against a production
# build of this commit, served by `next start`, so it depends on no deployment.
#
# The run has two roles, and the trigger list is where they meet.
#
# Into main, and on main itself, it is a required merge gate: the whole suite
# must be green, because a criterion is only shipped when every spec that states
# it passes. Required by the `main` ruleset alone, with GitHub Actions as its
# only accepted source: a repository setting, so nothing here enforces it.
#
# On a push to a milestone branch it is advisory, and part of it is red by
# design: the criterion's specs land first and fail until each Task builds the
# behaviour they describe. It is in no ruleset there and blocks nothing. It
# runs as each Task merges so the milestone is judged by the specs as it grows,
# and the driver reads it: a failure outside the criterion's own spec file is a
# regression the milestone is carrying, not a specification waiting for its
# behaviour. No gate can tell those two apart, which is why this one reports
# and a person judges. That is #71's decision, not ADR-0006's: ADR-0006 rejected
# a check allowed to be red on the ground that nobody reads it, and the answer
# is the reader, written into `/implement-issue`'s loop.
#
# That advisory run reports under a name of its own, `E2E build (advisory)`,
# which is what the `name:` expression on the job below produces. The `main`
# ruleset requires `E2E build` by name, and a required check's name has to mean
# one thing: GitHub's "About protected branches" says to keep job names unique
# across workflows, because a shared name "can cause ambiguous status check
# results and block pull requests from being merged", and "Troubleshooting
# required status checks" says that when a check and a status share a name, both
# must pass for that name to pass. A milestone's final commit is the head of the
# integration pull request and the tip of the milestone at once, so without the
# second name one SHA would carry two runs called `E2E build` -- a green gate
# and an advisory run that is red by design. Everything the ruleset reads keeps
# the name `E2E build`: a pull request builds `refs/pull/N/merge`, which is not
# a push, and a push to `main` is not `refs/heads/milestone/`.
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
#
# Two Task merges in quick succession cancel the earlier run, through the
# `concurrency` group below. The survivor is the one built from the later tree,
# which is the milestone as it now stands, so that is the run to read.
#
# A pull request onto a milestone still runs nothing: it would be red by design
# too, and ADR-0002 says the specs must not block the branch that exists to
# satisfy them.
#
# Its own workflow rather than a job in ci.yml behind `if:`, because the two fail
# differently. A job skipped by `if:` reports success to a required check. A pull
# request opened into a milestone and later retargeted to main -- which GitHub
# does by itself when the milestone branch is merged and deleted -- gets no new
# run, since a base change is an `edited` event. It would keep that skipped,
# successful check. A workflow filtered out by `branches:` reports nothing, so
# the same pull request waits for a run instead of passing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'milestone/**']

concurrency:
  group: e2e-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  e2e-build:
    name: ${{ github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/milestone/')
      && 'E2E build (advisory)'
      || 'E2E build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ADR-0012. The first criterion of Phase 1 writes an entry and reads it
    # back, so the gate that decides whether a milestone may reach `main` needs
    # a database or it judges the absence of one. postgres:18-alpine is the
    # image docker-compose.yml runs and the version both Neon projects are on;
    # nothing checks that the three agree, and a mismatch surfaces as a
    # migration that passes here and fails on Neon.
    #
    # The job runs on the host, not in a container, so the service is reached
    # through a mapped port on 127.0.0.1 rather than by service name. Port 5432:
    # the runner is a clean machine, so docker-compose.yml's reason for 5433
    # does not apply, and a different port keeps this live URL from reading like
    # the dead one it replaces. Steps do not start until the health check
    # passes.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Before the build, so a broken migration fails the job in seconds rather
      # than after it. The specs then run on the schema this commit carries,
      # which is the point: a milestone's behaviour is judged against its own
      # tables, not against whatever `main` last applied.
      - name: Migrate the CI database
        run: pnpm --filter @repo/db db:migrate
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/e2e

      - run: pnpm exec playwright install --with-deps chromium

      # No DATABASE_URL here, as in `Gates`: the build must not need it
      # (ADR-0005), and turbo hashes it into the build task.
      - name: 6. build
        run: pnpm build

      # playwright.config.ts starts `next start` itself when E2E_BASE_URL is
      # unset, and that server inherits this step's environment. The URL is set
      # here and nowhere wider: set on the job, it would reach the build above
      # and change what turbo hashes; moved into ci.yml's `env:`, it would reach
      # `Gates`, which proves the environment is validated lazily by building
      # with none at all.
      # The specs sign in through the test sign-in (ADR-0021), which exists only
      # where AUTH_TEST_LOGIN is set. The Google client is required by parseEnv
      # and never used here: Google cannot redirect to this job, discovery is at
      # first use, and no spec follows the Google link. So these are
      # placeholders, not secrets.
      - name: 7. test:e2e
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/e2e
          AUTH_TEST_LOGIN: '1'
          GOOGLE_CLIENT_ID: e2e-build-placeholder
          GOOGLE_CLIENT_SECRET: e2e-build-placeholder

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-build
          path: playwright-report
          if-no-files-found: warn
