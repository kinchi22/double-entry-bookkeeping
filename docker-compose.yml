# Local development Postgres.
#
# Portable Postgres only, matching the deployment target: no vendor extensions,
# no vendor-specific APIs. The same migrations run here, on Neon, or on RDS.
#
# Credentials live in a gitignored `.env` (copy `.env.example`). The defaults
# below exist so `docker compose up` works before that file is written; they are
# local-only and are not secrets.
name: double-entry-bookkeeping

services:
  postgres:
    image: postgres:18-alpine
    container_name: deb-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-bookkeeping}
    ports:
      # Host 5433, not 5432: another project's Postgres commonly holds the
      # default port. Change POSTGRES_PORT in .env if 5433 is taken too, and
      # change DATABASE_URL to match.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # From 18 the image keeps its data in a versioned directory under
      # /var/lib/postgresql, so the volume mounts there rather than at .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-bookkeeping}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
