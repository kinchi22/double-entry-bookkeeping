packages:
  - 'apps/*'
  - 'packages/*'

# --- Supply-chain policy -----------------------------------------------------
# Refuse to install any package version published less than 7 days ago.
# 10080 minutes = 7 days. Most malicious-publish incidents (compromised
# maintainer tokens, typosquat waves, postinstall droppers) are detected and
# unpublished well inside that window, so a cooling-off period converts most of
# them into a resolution that simply never happens.
#
# Consequence: `pnpm add <pkg>@latest` resolves to the newest version that is
# already 7 days old, not the newest version that exists.
minimumReleaseAge: 10080

# Escape hatch for the policy above. Packages listed here bypass the cooling-off
# period entirely. Keep it EMPTY by default: every bypass should arrive as an
# explicit, reviewable line in a diff, with the reason in the commit message.
# Legitimate use: shipping a same-day fix for a disclosed CVE.
minimumReleaseAgeExclude: []

# Postinstall scripts are arbitrary code execution at install time. pnpm refuses
# to install while any of them is undecided, so this map is the decision: `true`
# runs the script, `false` refuses it, and a package that appears without an
# entry fails the install until someone looks at it.
#
# Keys are version-qualified, and pnpm enforces that: an entry for one version
# does not approve the next one, which has to be re-approved in a diff.
#
# esbuild unpacks the platform binary its bundler runs, so it needs its script.
# The other three arrive under @testcontainers/postgresql -> dockerode -> ssh2
# and none is needed: ssh2 and cpu-features build an optional native addon that
# only speeds up SSH crypto, used for reaching a remote Docker host over SSH,
# which this repo never does, and protobufjs only generates CLI helper files.
# Refusing all three leaves the JavaScript fallbacks in place.
allowBuilds:
  esbuild@0.18.20: true
  esbuild@0.25.12: true
  esbuild@0.28.2: true
  cpu-features@0.0.10: false
  protobufjs@7.6.6: false
  ssh2@1.17.0: false
