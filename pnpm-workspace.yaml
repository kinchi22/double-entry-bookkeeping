packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  cpu-features: set this to true or false
  esbuild: true
  protobufjs: set this to true or false
  ssh2: set this to true or false

# --- Supply-chain policy -----------------------------------------------------
# Refuse to install any package version published less than 7 days ago.
# 10080 minutes = 7 days. Most malicious-publish incidents (compromised
# maintainer tokens, typosquat waves, postinstall droppers) are detected and
# unpublished well inside that window, so a cooling-off period converts most of
# them into a resolution that simply never happens.
#
# Consequence: `pnpm add <pkg>@latest` resolves to the newest version that is
# already 7 days old, not the newest version that exists.
minimumReleaseAge: 10080

# Escape hatch for the policy above. Packages listed here bypass the cooling-off
# period entirely. Keep it EMPTY by default: every bypass should arrive as an
# explicit, reviewable line in a diff, with the reason in the commit message.
# Legitimate use: shipping a same-day fix for a disclosed CVE.
minimumReleaseAgeExclude: []

# Postinstall scripts are arbitrary code execution at install time, so they are
# denied by default and allowed only for packages that genuinely need to unpack
# a native binary. Entries are version-qualified: a new version has to be
# re-approved rather than inheriting trust from its predecessor.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - 'esbuild@0.18.20'
  - 'esbuild@0.25.12'
  - 'esbuild@0.28.2'
  - sharp

# Postinstall scripts that are deliberately NOT run. Listing them here is an
# acknowledgement, not an approval: pnpm refuses to install while an ignored
# build is unaccounted for, so every one of these had to be looked at.
#
# All three arrive under @testcontainers/postgresql -> dockerode -> ssh2, and
# none of them is needed. ssh2 and cpu-features build an optional native addon
# that only speeds up SSH crypto, which is used for talking to a remote Docker
# host over SSH -- not something this repo does. protobufjs postinstall only
# generates CLI helper files. Skipping all three leaves the JavaScript
# fallbacks in place.
ignoredBuiltDependencies:
  - cpu-features@0.0.10
  - protobufjs@7.6.6
  - ssh2@1.17.0
